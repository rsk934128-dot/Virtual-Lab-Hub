name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Restoring app/google-services.json for CI..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "1049410601688",
    "project_id": "gen-lang-client-0838741245",
    "storage_bucket": "gen-lang-client-0838741245.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:1049410601688:android:693c2f41e995f89ec38dad",
        "android_client_info": {
          "package_name": "com.virtuallab.app"
        }
      },
      "oauth_client": [
        {
          "client_id": "1049410601688-1jnbmu0fgsbou6a6q9g401psociqu0oa.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.virtuallab.app",
            "certificate_hash": "c6d2fb814a4a9b63e68980886d8cd53645f68fb9"
          }
        },
        {
          "client_id": "1049410601688-5f2mvgetelqfa6i46evkh2lhfgk4qbj0.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCTW7OjqCRg2M9cTMXSWBbw7et2o04UAto"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "1049410601688-5f2mvgetelqfa6i46evkh2lhfgk4qbj0.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          echo "Verified app/google-services.json exists."

      - name: Prepare Signing Keystores for CI
        run: |
          # 1. Prepare Debug Keystore
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare Release Keystore fallback if secrets are not provided
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating CI upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Virtual Lab Release,O=VirtualLab,C=US"
          fi

      - name: Build APK with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLabHub-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          name: Virtual Lab Hub Release ${{ github.ref_name }}
          draft: false
          prerelease: false
